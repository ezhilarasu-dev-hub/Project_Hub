# Application Configuration
spring.config.import=optional:file:.env[.properties]
server.port=${SERVER_PORT:8080}

# SQLite Datasource Configuration (configurable via PROJECT_HUB_DB_PATH)
spring.datasource.url=jdbc:sqlite:${PROJECT_HUB_DB_PATH:./project_hub.db}
spring.datasource.driver-class-name=org.sqlite.JDBC

# JPA / Hibernate Configuration for SQLite
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Application Storage & RAG Settings (configurable via PROJECT_HUB_UPLOAD_DIR / PROJECT_HUB_KNOWLEDGE_FILE)
app.storage.upload-dir=${PROJECT_HUB_UPLOAD_DIR:./uploads/projects/}
app.rag.knowledge-file=${PROJECT_HUB_KNOWLEDGE_FILE:senior_projects.txt}

# JWT Security Configuration
jwt.secret=${JWT_SECRET:9a3f4b8c2d1e0f9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Groq API Configuration (Backend-only, configurable via GROQ_API_KEY / GROQ_MODEL)
groq.api.key=${GROQ_API_KEY:}
groq.api.url=${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
groq.model=${GROQ_MODEL:qwen/qwen3.8-27b}

# Actuator Health Check Configuration (Only /actuator/health exposed publicly, no sensitive data)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
